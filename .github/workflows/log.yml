name: Log forecast snapshot

# Records a model snapshot to the forward log every 10 min so live self-scoring,
# per-lead sigma, and the intraday consensus history keep accumulating in the
# cloud — independent of any computer. The logs live on an orphan `data` branch
# (forecast_log.jsonl, consensus_history.jsonl, settlements.jsonl, betting_log.jsonl,
# calibration.json), kept separate from the deployed branch so these commits
# don't restart the app.

on:
  # GitHub's own scheduler is best-effort and unreliable (it dropped most of the
  # 30-min runs, firing only ~3x/day). So the schedule is a free fallback only;
  # the dependable 10-min cadence comes from an external cron (cron-job.org)
  # POSTing a repository_dispatch of type `log-snapshot` to the GitHub API.
  # NOTE: set that external cron-job.org trigger to every 10 min too — this
  # in-repo schedule is only GitHub's best-effort fallback; the reliable cadence
  # is driven by cron-job.org, so the chart won't speed up until it's updated.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"  # fallback every 10 min (GitHub honors this loosely)
  workflow_dispatch: {}         # allow manual runs from the Actions tab
  repository_dispatch:
    types: [log-snapshot]       # external scheduler triggers this for reliable timing

permissions:
  contents: write               # lets the built-in token push the data branch

concurrency:
  # One shared group across all triggers (external cron, schedule fallback, manual)
  # so they serialize on the data branch — never two force-pushes racing. With
  # frequent 10-min runs the fallback schedule can fire alongside the external
  # cron; cancel-in-progress collapses such overlaps to the newest run. That's
  # safe and preferable here because every run captures a full fresh snapshot, so
  # a superseded in-flight run carries nothing the newer one doesn't recompute.
  group: forecast-log
  cancel-in-progress: true

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore existing logs from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:forecast_log.jsonl > forecast_log.jsonl || true
            git show origin/data:consensus_history.jsonl > consensus_history.jsonl || true
            git show origin/data:settlements.jsonl > settlements.jsonl || true
            git show origin/data:betting_log.jsonl > betting_log.jsonl 2>/dev/null || true
            git show origin/data:calibration.json > calibration.json 2>/dev/null || true
            git show origin/data:calibration_history.jsonl > calibration_history.jsonl 2>/dev/null || true
            git show origin/data:cli_alert_state.json > cli_alert_state.json 2>/dev/null || true
            git show origin/data:resolved_alert_state.json > resolved_alert_state.json 2>/dev/null || true
            git show origin/data:event_alert_state.json > event_alert_state.json 2>/dev/null || true
            git show origin/data:det_models.json > det_models.json 2>/dev/null || true
            # Per-station (non-KDFW) logs live under data/<STATION>/ on the branch.
            mkdir -p data/KAUS
            for f in forecast_log.jsonl consensus_history.jsonl settlements.jsonl \
                     betting_log.jsonl calibration.json calibration_history.jsonl \
                     det_models.json cli_alert_state.json resolved_alert_state.json \
                     event_alert_state.json; do
              git show origin/data:data/KAUS/$f > data/KAUS/$f 2>/dev/null || true
            done
          fi

      - name: Append this snapshot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scheduled_log.py

      - name: Publish the logs to the data branch
        run: |
          set -e
          tmp="$(mktemp -d)"
          cp forecast_log.jsonl "$tmp/forecast_log.jsonl"
          [ -f consensus_history.jsonl ] && cp consensus_history.jsonl "$tmp/consensus_history.jsonl"
          [ -f settlements.jsonl ] && cp settlements.jsonl "$tmp/settlements.jsonl"
          [ -f betting_log.jsonl ] && cp betting_log.jsonl "$tmp/betting_log.jsonl"
          [ -f calibration.json ] && [ -s calibration.json ] && cp calibration.json "$tmp/calibration.json"
          [ -f calibration_history.jsonl ] && cp calibration_history.jsonl "$tmp/calibration_history.jsonl"
          [ -f cli_alert_state.json ] && cp cli_alert_state.json "$tmp/cli_alert_state.json"
          [ -f resolved_alert_state.json ] && cp resolved_alert_state.json "$tmp/resolved_alert_state.json"
          [ -f event_alert_state.json ] && cp event_alert_state.json "$tmp/event_alert_state.json"
          [ -f det_models.json ] && cp det_models.json "$tmp/det_models.json"
          # Per-station (non-KDFW) files: copy only non-empty ones so the empty
          # placeholders the restore step creates don't get committed.
          if [ -d data/KAUS ]; then
            mkdir -p "$tmp/data/KAUS"
            for f in data/KAUS/*; do
              [ -s "$f" ] && cp "$f" "$tmp/data/KAUS/"
            done
          fi
          cd "$tmp"
          git init -q
          git config user.name "weather-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b data
          git add forecast_log.jsonl
          [ -f consensus_history.jsonl ] && git add consensus_history.jsonl
          [ -f settlements.jsonl ] && git add settlements.jsonl
          [ -f betting_log.jsonl ] && git add -f betting_log.jsonl
          [ -f calibration.json ] && git add -f calibration.json
          [ -f calibration_history.jsonl ] && git add -f calibration_history.jsonl
          [ -f cli_alert_state.json ] && git add -f cli_alert_state.json
          [ -f resolved_alert_state.json ] && git add -f resolved_alert_state.json
          [ -f event_alert_state.json ] && git add -f event_alert_state.json
          [ -f det_models.json ] && git add -f det_models.json
          if [ -d data/KAUS ] && [ -n "$(ls -A data/KAUS 2>/dev/null)" ]; then
            git add -f data/KAUS/
          fi
          git commit -q -m "log: snapshot $(date -u +%FT%TZ)"
          git push -fq \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data

      # Piggyback a trade tick on this run's reliable 10-min cadence. trade.yml's
      # own schedule is throttled by GitHub to roughly hourly, which is far too
      # coarse to catch a bracket while it is still priced inside the trader's
      # bounds. Must use the PAT: events raised with the built-in GITHUB_TOKEN
      # deliberately do not start new workflow runs.
      #
      # Fire-and-forget by design — logging must never depend on, or fail because
      # of, trading (see trade.yml's header). Missing secret or a failed POST is
      # printed and ignored, and the trader self-gates on its market window, kill
      # switch, and mode, so an out-of-hours tick is a no-op.
      - name: Tick the trade loop
        if: always()
        continue-on-error: true
        env:
          TRADE_GH_TOKEN: ${{ secrets.TRADE_GH_TOKEN }}
        run: |
          if [ -z "$TRADE_GH_TOKEN" ]; then
            echo "TRADE_GH_TOKEN unset — skipping trade tick"; exit 0
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRADE_GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"trade-tick"}' || echo "trade tick POST failed — ignored"

      # Piggyback the mispriced-bracket screen too, for the same reason and on
      # the same measurement: this workflow's external cron delivered 100 runs at
      # a median 10.0-min gap on 2026-08-04, while GitHub's own scheduler gave
      # scan.yml 62% of its hourly slots (median 23 min late, worst gap 3 hours).
      # The Screen page's Ref column is only recomputed when the screen fires, so
      # that scheduler was leaving it 1-3 hours stale against a live NO price.
      #
      # Twice an hour, not every run: `minute % 30 < 10` selects exactly one
      # heartbeat per half hour at any phase, given the 10-min cadence above.
      # %-M (no leading zero) matters -- "08" is an invalid octal literal in
      # shell arithmetic and would abort the step.
      #
      # Restricted to repository_dispatch runs because this workflow has TWO
      # trigger sources, and the slot test alone cannot tell them apart. Live on
      # 2026-08-04: the external cron fired at 23:00:11 (minute 0) and the
      # in-repo schedule fallback at 23:01:50 (minute 1), so BOTH passed
      # `minute % 30 < 10` and the screen ran twice, 90 seconds apart. Only the
      # external cron is the clock this is pacing off; if it dies, scan.yml's own
      # hourly schedule is the fallback, which is the arrangement anyway.
      #
      # Fire-and-forget, like the trade tick: the screen is read-only review
      # material, and logging must never fail because of it. scan.yml keeps its
      # own hourly schedule as a fallback, so a missed tick costs freshness, not
      # data; a duplicate firing is harmless because the page reads only the
      # newest one.
      - name: Tick the mispriced-bracket screen
        if: always() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          SCAN_GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
        run: |
          MIN=$(date -u +%-M)
          if [ $((MIN % 30)) -ge 10 ]; then
            echo "minute $MIN — not a screen slot, skipping"; exit 0
          fi
          if [ -z "$SCAN_GH_TOKEN" ]; then
            echo "SCAN_GH_TOKEN unset — skipping screen tick"; exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SCAN_GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"screen-run"}') || code="000"
          # 204 is success. Anything else is printed, not raised: a bad or
          # expired PAT must be visible in the log rather than silently leaving
          # the screen on the fallback schedule.
          if [ "$code" = "204" ]; then
            echo "screen-run dispatched (minute $MIN)"
          else
            echo "screen tick POST failed (HTTP $code) — ignored"
          fi

      # Same clock, no 30-minute gate: the row alert wants every heartbeat it
      # can get, and its own job splits each into two checks five minutes apart.
      - name: Tick the screen row alert
        if: always() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          SCAN_GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
        run: |
          if [ -z "$SCAN_GH_TOKEN" ]; then
            echo "SCAN_GH_TOKEN unset — skipping alert tick"; exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SCAN_GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"screen-alert"}') || code="000"
          if [ "$code" = "204" ]; then
            echo "screen-alert dispatched"
          else
            echo "alert tick POST failed (HTTP $code) — ignored"
          fi
